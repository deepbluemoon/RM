[project]
name = "crd-model-server"
version = "0.1.0"
description = "계약위험탐지서비스 로컬 모델 게이트웨이 (M1·M2 CPU, M3·M4 공유 Ollama)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 파인튜닝 체크포인트로 M1·M2 를 돌릴 때만 설치한다: uv sync --extra classifiers
classifiers = ["torch>=2.3", "transformers>=4.44"]
# 모델 원본 받기(scripts/fetch_models.py): uv sync --extra tools
tools = ["huggingface_hub>=0.24"]
# LLM_PROVIDER=vertex 로 M3·M4 를 Google Cloud(Vertex AI)로 돌릴 때만: uv sync --extra vertex
# requests 는 google-auth 의 토큰 refresh 전송(google.auth.transport.requests)에 쓰인다
vertex = ["google-auth>=2.30", "requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.22"]

[tool.uv]
package = false

# torch 는 CPU 전용 빌드만 받는다 — Linux amd64 기본 휠은 GPU(CUDA) 라이브러리까지 받아 이미지가 수 GB 커진다.
# 추론은 CPU 로만 한다(config.yaml classifiers.device: cpu). docs/docker-image-policy.md §4
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
