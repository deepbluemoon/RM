      x-ipo: ['4.11']
      responses:
        '200':
          description: OK (없으면 빈 배열 → 화면 "유사 사례 없음")
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FtcCase' } }
  /results/{runId}/clauses/{assessmentId}/rejudge:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/AssessmentId' }
    post:
      tags: [results]
      summary: "\"분석 불가\" 조항 1건 다시 분석 — 당시 지식 기준일로(FR-039)"
      x-ipo: ['4.5']
      x-gates: [G5]
      responses:
        '200': { description: 새 판정, content: { application/json: { schema: { $ref: '#/components/schemas/ClauseDetail' } } } }
        '409': { description: 분석 불가 조항이 아님, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: G5 — 분석 불가 유지, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /results/{runId}/impacts:
    parameters: [ { $ref: '#/components/parameters/RunId' } ]
    get:
      tags: [results, history]
      summary: 분석 이후 근거 변경 내용(개정·폐지·신규 사례·표준약관 개정) — C9 [변경 내용 보기]
      x-ipo: ['6.3']
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResultImpact' } } } } }
  /evidence/{evidenceVersionId}:
    parameters:
      - { name: evidenceVersionId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [results]
      summary: 출처 드로어(D1) — 근거 6항목 + 사례 3구분
      x-ipo: ['4.6', '4.7']
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Evidence' } } } }

  # ------------------------------------------------------------------ feedback (P5)
  /feedback/preview:
    post:
      tags: [feedback]
      summary: 의견 비식별화 미리보기(저장 전 — SD_01 §8-3)
      x-ipo: ['5.3']
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [opinion], properties: { opinion: { type: string, maxLength: 2000 } } }
      responses:
        '200':
          description: 가림 적용 미리보기
          content:
            application/json:
              schema:
                type: object
                properties:
                  opinionDeid: { type: string }
                  maskedTypes: { type: array, items: { $ref: '#/components/schemas/PiiType' } }
  /feedback:
    post:
      tags: [feedback]
      summary: 판정 피드백 제출(H4) — 대상 조항·판정·지식 기준일 연결, 상태=미검토. 판정은 바뀌지 않는다
      x-ipo: ['5.1', '5.2', '5.4', '5.5']
      x-gates: [G8]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessmentId, feedbackType]
              properties:
                assessmentId: { type: integer }
                feedbackType: { type: string, enum: [false_positive, false_negative] }
                opinion: { type: string, maxLength: 2000, description: 선택. 서버가 다시 비식별화 후 저장 }
      responses:
        '201': { description: 접수, content: { application/json: { schema: { type: object, properties: { feedbackId: { type: integer }, notice: { type: string } } } } } }
        '400': { description: '유형이 대상 판정과 맞지 않음(위험 판정→오탐만, 정상·분석 불가→미탐만)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: G8 대상 결과 없음·세션 만료, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }

  # ------------------------------------------------------------------ history (P6)
  /history:
    get:
      tags: [history]
      summary: 내 분석 기록 목록(최신순, 근거 변경 표시) — 로그인 필요
      x-ipo: ['6.1']
      x-gates: [G8]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HistoryItem' } }
                  nextCursor: { type: string, nullable: true }
        '401': { description: G8 로그인 필요, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /history/{requestId}:
    parameters: [ { $ref: '#/components/parameters/RequestId' } ]
    get:
      tags: [history]
      summary: 기록 열람 — 요청의 실행(최초·재분석) 목록과 각 결과의 당시 지식 기준일
      x-ipo: ['6.2']
      x-gates: [G8]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryDetail' } } } }
        '403': { description: G8 본인 기록 아님, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
    delete:
      tags: [history]
      summary: 문서와 결과 영구 삭제(FR-008) — 사용량 원장은 유지(run_id 만 NULL). 이 결과에 달린 피드백은 user_id·session_id·judgment_id 를 NULL 로 익명화해 보존(A16). 비로그인 소유자도 가능
      x-ipo: ['6.4']
      x-gates: [G8]
      responses:
        '204': { description: 삭제됨 }
  /history/{requestId}/reanalyses:
    parameters: [ { $ref: '#/components/parameters/RequestId' } ]
    post:
      tags: [history]
      summary: 최신 지식 기준일로 재분석 — 서버 확인(G5)만 하고 보관된 비식별 조항으로 P3 재분석 모드(M4 미호출). 한도를 차감하지 않으며 한도를 다 쓴 사용자도 가능(FR-034·035(e))
      x-ipo: ['6.5', '6.6']
      x-gates: [G5, G8]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [prevRunId], properties: { prevRunId: { type: integer } } }
      responses:
        '202': { description: 재분석 실행 시작, content: { application/json: { schema: { type: object, properties: { runId: { type: integer }, knowledgeDate: { type: string, format: date } } } } } }
        '503': { description: G5, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }

  # ------------------------------------------------------------------ admin: knowledge (P0)
  /admin/knowledge/versions:
    get:
      tags: [admin-knowledge]
      summary: 지식 기준일 목록(활성·대체됨), 분석 기준 버전
      x-gates: [G14]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KnowledgeVersion' } } } } }
  /admin/knowledge/ingest-batches:
    post:
      tags: [admin-knowledge]
      summary: 근거 데이터 갱신 개시 — 기준일 이후 변경분 수집(4개 기관 병렬)
      x-ipo: ['0.1', '0.2', '0.3']
      x-gates: [G0, G1, G14]
      responses:
        '202': { description: 수집 시작, content: { application/json: { schema: { type: object, properties: { batchId: { type: integer } } } } } }
  /admin/knowledge/ingest-batches/{batchId}:
    parameters: [ { $ref: '#/components/parameters/BatchId' } ]
    get:
      tags: [admin-knowledge]
      summary: 갱신 진행(레일)·기관별 수집 결과(G0)·반영 대상 판정 라벨(v_ingest_item_status)·검토 목록(G1)·반영 경과일
