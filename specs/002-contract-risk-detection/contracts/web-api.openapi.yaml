      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/IngestBatch' } } } }
  /admin/knowledge/ingest-batches/{batchId}/retry:
    parameters: [ { $ref: '#/components/parameters/BatchId' } ]
    post:
      tags: [admin-knowledge]
      summary: G0 해제 — 다시 수집
      responses:
        '202': { description: 재수집 시작 }
  /admin/knowledge/ingest-batches/{batchId}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/BatchId' }
      - { name: itemId, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [admin-knowledge]
      summary: 항목 반영 포함 여부(include_flag) — 분리 실패(G1) 항목은 포함 불가(DB 거부)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [include], properties: { include: { type: boolean } } }
      responses:
        '200': { description: OK }
        '409': { description: G1 분리 실패 항목, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /admin/knowledge/ingest-batches/{batchId}/approve:
    parameters: [ { $ref: '#/components/parameters/BatchId' } ]
    post:
      tags: [admin-knowledge]
