      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeedbackRow' } } } } }
  /admin/feedback/summary:
    get:
      tags: [admin-feedback]
      summary: 기준일별 검토 현황(v_feedback_summary)
      x-ipo: ['8.6']
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /admin/feedback/{feedbackId}:
    parameters: [ { $ref: '#/components/parameters/FeedbackId' } ]
    get:
      tags: [admin-feedback]
      summary: 피드백 상세 — 대상 조항·당시 판정·근거, 이후 근거 변경, 결과 삭제됨(대상 표시 불가). 표시 직전 PII 재검사(G13)
      x-ipo: ['8.3']
      x-gates: [G13]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FeedbackDetail' } } } }
  /admin/feedback/{feedbackId}/review:
    parameters: [ { $ref: '#/components/parameters/FeedbackId' } ]
    post:
      tags: [admin-feedback]
