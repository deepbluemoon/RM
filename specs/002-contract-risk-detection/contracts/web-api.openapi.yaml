      responses:
        '200':
          description: 새 기준일
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgeVersion: { $ref: '#/components/schemas/KnowledgeVersion' }
                  impactedResultCount: { type: integer }
                  deadlineWarnings: { type: array, items: { type: object, properties: { itemId: { type: integer }, elapsedDays: { type: integer } } } }
        '409': { description: G0 수집 실패 상태, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }

  # ------------------------------------------------------------------ admin: evaluation (P7)
  /admin/eval/overview:
    get:
      tags: [admin-eval]
      summary: 평가 화면 진입 — 검수 완료 평가 데이터 수(유형별), 지식 기준일·분석 기준 버전, 현재 model_version·학습 기준일
      x-ipo: ['7.1']
      x-gates: [G14]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /admin/eval/items:
    get:
      tags: [admin-eval]
      summary: 평가 데이터 목록(검수 상태·출처·H5 후보 포함)
      parameters:
        - { name: reviewStatus, in: query, schema: { type: string, enum: [pending, accepted, rejected] } }
        - { name: contractType, in: query, schema: { $ref: '#/components/schemas/ContractType' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvalItem' } } } } }
    post:
      tags: [admin-eval]
      summary: 평가 데이터 등록(새 라벨·H5 후보 승격) — 검수 전 pending
      x-ipo: ['7.2']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clauseTextDeid, contractType, goldCategory, origin]
              properties:
                clauseTextDeid: { type: string }
                contractType: { $ref: '#/components/schemas/ContractType' }
                goldCategory: { $ref: '#/components/schemas/RiskCategory' }
                origin: { type: string, enum: [new_label, feedback_candidate, synthetic] }
                candidateId: { type: integer }
                goldEvidenceItemIds: { type: array, items: { type: integer } }
      responses:
        '201': { description: Created }
  /admin/eval/items/{evalItemId}/review:
    parameters: [ { name: evalItemId, in: path, required: true, schema: { type: integer } } ]
    post:
      tags: [admin-eval]
      summary: 법률 전문가 검수(S7-E) — 채택·반려. 인위적 변형·학습 중복은 채택 불가(G10, DB 거부)
      x-ipo: ['7.2']
      x-gates: [G10]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [accepted, rejected] } } }
      responses:
        '200': { description: OK }
        '409': { description: G10 해제 불가 조항, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /admin/eval/runs:
    post:
      tags: [admin-eval]
      summary: 평가 시작 — 적격성 검사(G10·G12) → P3 평가 모드 일괄 추론 → 재현율·정밀도 계산
      x-ipo: ['7.4', '7.5', '7.6']
      x-gates: [G5, G10, G12]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evalItemIds: { type: array, items: { type: integer }, description: 비우면 검수 완료 전체 }
      responses:
        '202': { description: 평가 실행 시작, content: { application/json: { schema: { type: object, properties: { evalRunId: { type: integer } } } } } }
        '503': { description: G5, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /admin/eval/runs/{evalRunId}:
    parameters: [ { $ref: '#/components/parameters/EvalRunId' } ]
    get:
      tags: [admin-eval]
      summary: 평가 진행·유형별 지표(v_eval_metric_live 또는 기록된 eval_metric)·편향 경고(15%p)·미달 경고·확정 가능 여부
      x-ipo: ['7.6', '7.8']
      x-gates: [G11, G12]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/EvalRun' } } } }
  /admin/eval/runs/{evalRunId}/evidence-reviews:
    parameters: [ { $ref: '#/components/parameters/EvalRunId' } ]
    get:
      tags: [admin-eval]
      summary: 근거 적합성 표본 목록(전문가 판정 대상)
      x-ipo: ['7.7']
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /admin/eval/runs/{evalRunId}/evidence-reviews/{evalItemId}/{evidenceVersionId}:
    parameters:
      - { $ref: '#/components/parameters/EvalRunId' }
      - { name: evalItemId, in: path, required: true, schema: { type: integer } }
      - { name: evidenceVersionId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [admin-eval]
      summary: 근거 적합성 판정 회신(G11 해제 — 법률 전문가, 또는 운영자 대리 입력)
      x-ipo: ['7.7']
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [verdict], properties: { verdict: { type: string, enum: [relevant, irrelevant] } } }
      responses:
        '200': { description: OK }
  /admin/eval/runs/{evalRunId}/record:
    parameters: [ { $ref: '#/components/parameters/EvalRunId' } ]
    post:
      tags: [admin-eval]
      summary: 평가 기록(H6) — 지표를 기준일·분석 기준 버전·M1~M3 model_version 과 고정 저장
      x-ipo: ['7.9']
      responses:
        '200': { description: 기록됨 }
        '409': { description: 중단(aborted)된 평가는 기록 불가, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/eval/runs/{evalRunId}/confirm:
    parameters: [ { $ref: '#/components/parameters/EvalRunId' } ]
    post:
      tags: [admin-eval]
      summary: 성공 기준 확정(SD_02 U-4) — 판정 대기(G11)·측정 불가(G12)가 남으면 DB 트리거가 거부
      x-gates: [G11, G12]
      responses:
        '200': { description: 확정 }
        '409': { description: G11/G12, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /admin/eval/compare:
    get:
      tags: [admin-eval]
      summary: 기록된 두 평가의 지표 비교(새 평가 없이)
      x-ipo: ['7.3']
      parameters:
        - { name: a, in: query, required: true, schema: { type: integer } }
        - { name: b, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }

  # ------------------------------------------------------------------ admin: feedback review (P8)
  /admin/feedback:
    get:
      tags: [admin-feedback]
