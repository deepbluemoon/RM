      x-ipo: ['8.4']
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [valid, invalid, needs_expert] } } }
      responses:
        '200': { description: OK }
  /admin/feedback/{feedbackId}/eval-candidate:
    parameters: [ { $ref: '#/components/parameters/FeedbackId' } ]
    post:
      tags: [admin-feedback]
      summary: 평가 데이터 후보 지정(H5) — 타당 판단 피드백만(DB 트리거)
      x-ipo: ['8.5']
      responses:
        '201': { description: 후보 생성 }
        '409': { description: 타당 판단이 아님 또는 이미 후보, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ------------------------------------------------------------------ admin: model API (P9)
  /admin/model-api/status:
    get:
      tags: [admin-model-api]
      summary: 서버 상태·모델별 로드·통합 메모리(있을 때만)·model_version·학습 기준일 + 조회 시각. 503/504/401 도 200 으로 상태만 표시(화면을 막지 않음). ?refresh=1 = 캐시 무시. 운영자(modelApi.manage)
      x-ipo: ['9.5', '9.6']
      x-gates: [G14]
      parameters:
        - { name: refresh, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModelApiStatus' } } } }
        '403': { description: G14, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /admin/model-api/openapi:
    get:
      tags: [admin-model-api]
      summary: 모델 API 서버 /openapi.json 백엔드 프록시(9.7 A1). API 키는 응답에 싣지 않는다
      x-ipo: ['9.7']
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '502': { description: 모델 서버 연결 불가 }
  /admin/model-api/docs/{name}:
    get:
      tags: [admin-model-api]
      summary: 모델 서버 운영 문서 열람 — 가이드라인·사용자 매뉴얼·서비스 점검 결과·모델 테스트 보고서(model-server/docs, reports). 정해진 이름만
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [guideline, manual, test-result, model-test] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [name, title, format, updatedAt, content]
                properties:
                  name: { type: string }
                  title: { type: string }
                  format: { type: string, enum: [markdown, json] }
                  updatedAt: { type: string, format: date-time }
                  content: { description: 'markdown 이면 문자열, json 이면 점검 결과 객체' }
        '404': { description: 없는 문서, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/model-api/try/{path}:
    parameters:
      - { name: path, in: path, required: true, description: '모델 API 경로(health, v1/models, v1/jobs/{id} …) — model-api 계약 경로만', schema: { type: string } }
    get:
      tags: [admin-model-api]
      summary: 웹 Swagger UI "Try it out" 프록시(GET). 발급받은 API 키(Bearer crd_…)를 확인한 뒤 서버 키로 넘긴다 — /model/{path} 와 같다
      responses:
        '200': { description: 모델 서버 응답 그대로, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { description: 허용되지 않은 경로, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      tags: [admin-model-api]
      summary: 웹 Swagger UI "Try it out" 프록시(POST). 본문은 기록하지 않는다
      responses:
        '200': { description: 모델 서버 응답 그대로, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { description: 발급 키 없음·불일치·폐기, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /model/{path}:
    description: |
      외부 프로그램용 모델 API 프록시(`admin.modelApi.routes.ts` tryHandler, `tryProxy.service.ts`). 처리 순서 = 허용 경로 확인(404) → 발급 키 확인(401, sha256 대조) → 조항 본문 재비식별화 → 서버 키(MODEL_API_KEY)로 모델 서버에 전달(제한 330초). 응답 상태·본문은 모델 서버 그대로(400 입력 검증·413 조항 2,000개 초과·503 적재 중 등).
      허용 경로 7종: GET health · GET v1/models · POST v1/detect/loophole·illegal · POST v1/jobs · GET v1/jobs/{job_id} · POST v1/judge · POST v1/summarize (v1/embed·docs 는 404). 요청 제한 = 접속 주소당 1분 60회(draft-7 RateLimit 헤더).
      아래 responses 에는 계약 테스트로 검증하는 코드만 적는다. 그 밖에 나올 수 있는 코드: 429 `rate_limited`(요청 제한, 테스트 모드에서는 꺼짐) · 502 `model_api_unreachable`(모델 서버 연결 불가) · 모델 서버가 낸 400(입력 검증)·413(조항 2,000개 초과)·503(적재 중)·504(제한 시간) 그대로.
      **v1/judge 근거 검색(2026-10-01)**: `evidence` 가 없거나 빈 배열이면 백엔드가 활성 지식 버전에서 웹 분석(P3)과 같은 하이브리드 검색으로 근거 5건을 찾아 넣고 `knowledge_date` 를 그 기준일로 맞춘다. 응답(200 JSON)에 `evidence_source`(server_search · caller · search_failed), `search_mode`(hybrid · bm25), `evidence[]`({id, source_type, title, text, source_url, cited})를 덧붙인다. 근거를 보내면(최대 10) 검색 없이 그 안에서만 인용하고 `evidence_source: caller` 만 붙는다. 검색이 실패하면 근거 없이 넘기고(설명 빈 배열) `search_failed` 로 알린다.
    parameters:
      - { name: path, in: path, required: true, description: '모델 API 경로(health, v1/models, v1/detect/loophole …) — model-api 계약 경로만', schema: { type: string } }
    get:
      tags: [model-api-public]
      summary: 외부 프로그램용 모델 API(2026-09-30). 로그인 없이 발급받은 API 키(Authorization Bearer crd_…)로 부른다. 백엔드가 서버 키로 모델 서버에 넘긴다
      security: [{ apiKey: [] }]
      responses:
        '200': { description: 모델 서버 응답 그대로, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { description: 키 없음·불일치·폐기, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 허용되지 않은 경로, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    post:
      tags: [model-api-public]
      summary: 외부 프로그램용 모델 API(POST). 조항 본문(clauses[].text · clause)은 넘기기 전에 백엔드가 다시 비식별화한다. 본문은 기록하지 않는다. v1/judge 는 evidence 를 비우면 서버가 근거를 검색해 넣는다(위 설명)
      security: [{ apiKey: [] }]
      responses:
        '200': { description: 모델 서버 응답 그대로(v1/jobs 는 202), content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { description: 키 없음·불일치·폐기, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { description: 허용되지 않은 경로(MODEL_API_PATH_NOT_ALLOWED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ------------------------------------------------------------------ API 키(2026-09-30)
  /api-keys:
    get:
      tags: [api-keys]
      summary: 내 API 키 목록(원문 없이 앞자리만)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ApiKey' } } } } } } }
    post:
      tags: [api-keys]
      summary: API 키 발급 — 원문(key)은 이 응답에서 한 번만 준다. 사용 중인 키는 5개까지
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string, maxLength: 40 } } }
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiKey' }
                  - { type: object, required: [key], properties: { key: { type: string } } }
        '409': { description: 사용 중인 키 5개 초과, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api-keys/{keyId}:
    delete:
      tags: [api-keys]
      summary: 내 키 폐기
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 폐기됨 }
        '404': { description: 없는 키·이미 폐기, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /admin/api-keys:
    get:
      tags: [api-keys]
      summary: 전체 API 키(운영자, modelApi.manage) — 주인 이름·아이디 포함
      x-gates: [G14]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminApiKey' } } } } } } }
  /admin/api-keys/{keyId}:
    delete:
      tags: [api-keys]
      summary: 누구의 키든 폐기(운영자)
      x-gates: [G14]
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 폐기됨 }
        '404': { description: 없는 키·이미 폐기, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ------------------------------------------------------------------ admin: RBAC (화면 S10 은 2026-09-30 삭제, API 만 유지)
  /admin/rbac:
    get:
      tags: [admin-rbac]
      summary: 역할(사용자 유형) × 권한(유스케이스) 사용 여부 표 — 현재 값·초기값·잠긴 칸(운영자 권한 관리). 화면 S10 은 삭제됐고 API 만 남음
      x-gates: [G14]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RbacView' } } } }
        '403': { description: G14, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
    put:
      tags: [admin-rbac]
      summary: 표 전체 저장 — 역할마다 켜 둘 권한 목록. 잠긴 칸은 항상 켜진다. 다음 요청부터 모든 사용자에 적용
      x-gates: [G14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matrix]
              properties:
                matrix: { $ref: '#/components/schemas/RoleMatrix' }
      responses:
        '200':
          description: 저장 후 표 + 바뀐 칸 수
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/RbacView' }
                  - { type: object, required: [changed], properties: { changed: { type: integer } } }
        '400': { description: 형식 오류(모르는 역할·권한), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { description: G14, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }

components:
  securitySchemes:
    apiKey: { type: http, scheme: bearer, description: 'API 활용 화면에서 발급받은 키(crd_…)' }
  parameters:
    RequestId: { name: requestId, in: path, required: true, schema: { type: integer } }
    RunId: { name: runId, in: path, required: true, schema: { type: integer } }
    AssessmentId: { name: assessmentId, in: path, required: true, schema: { type: integer } }
    BatchId: { name: batchId, in: path, required: true, schema: { type: integer } }
    EvalRunId: { name: evalRunId, in: path, required: true, schema: { type: integer } }
    FeedbackId: { name: feedbackId, in: path, required: true, schema: { type: integer } }

  schemas:
    Permission:
      type: string
      description: RBAC 권한(유스케이스 단위) — backend/src/modules/auth/rbac.ts PERMISSIONS
      enum: [analysis.request, result.view, explanation.view, history.manage, feedback.submit, knowledge.manage, eval.run, eval.review, feedback.review, modelApi.view, modelApi.manage, rbac.manage]
    LoginResult:
      type: object
      required: [ok, returnTo]
      properties:
        ok: { type: boolean }
        returnTo: { type: string }
    ApiKey:
      type: object
      required: [keyId, name, keyPrefix, createdAt, lastUsedAt, revokedAt]
      properties:
        keyId: { type: integer }
        name: { type: string }
        keyPrefix: { type: string, description: "'crd_' + 앞 8자 — 원문은 발급 때 한 번만" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    AdminApiKey:
      allOf:
        - { $ref: '#/components/schemas/ApiKey' }
        - type: object
          required: [userId, ownerName, ownerLoginId]
          properties:
            userId: { type: integer }
            ownerName: { type: string, nullable: true }
            ownerLoginId: { type: string, nullable: true }
    RoleMatrix:
      type: object
      required: [user, operator, legal_expert, developer]
      additionalProperties: false
      properties:
        user: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        operator: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        legal_expert: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        developer: { type: array, items: { $ref: '#/components/schemas/Permission' } }
    RbacView:
      type: object
      required: [roles, permissions, matrix, defaults, locked, updatedAt]
      properties:
        roles:
          type: array
          items: { type: object, required: [id, label], properties: { id: { type: string, enum: [user, operator, developer, legal_expert] }, label: { type: string } } }
        permissions:
          type: array
          items:
            type: object
            required: [id, label, uc, area]
            properties:
              id: { $ref: '#/components/schemas/Permission' }
              label: { type: string }
              uc: { type: string, description: 근거 유스케이스 }
              area: { type: string, enum: [user, ops, admin] }
        matrix: { $ref: '#/components/schemas/RoleMatrix' }
        defaults: { $ref: '#/components/schemas/RoleMatrix' }
        locked:
          type: array
          items: { type: object, required: [role, permission], properties: { role: { type: string }, permission: { $ref: '#/components/schemas/Permission' } } }
        updatedAt: { type: string, format: date-time, nullable: true }
    Perspective: { type: string, enum: [consumer, business] }
    ContractType: { type: string, enum: [ecommerce, subscription, installment, door_to_door, general_consumer, out_of_scope] }
    RiskCategory: { type: string, enum: [normal, dispute, unfair, illegal] }
    DisplayCategory: { type: string, enum: [normal, dispute, unfair, illegal, unanalyzable] }
    RiskType: { type: string, enum: [rights_limit, liability_avoid, refund_cancel_limit, unilateral_change, excessive_penalty, vague, other] }
    RiskLevel: { type: string, enum: [high, mid, low] }
    Confidence: { type: string, enum: [high, medium, low] }
    PiiType: { type: string, enum: [rrn, foreigner_no, account_no, card_no, phone, email, address, person_name] }
    GateCode: { type: string, pattern: '^G([0-9]|1[0-4])$' }

    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    GateError:
      description: 게이트 차단 본문(C2 — 사유·해제 주체·다음 행동). 문구는 SD_02 §14-2 사전과 동일
      type: object
      required: [gate, title, reason, releaseActor, nextActions]
      properties:
        gate: { $ref: '#/components/schemas/GateCode' }
        title: { type: string, example: 이번 달 무료 분석을 모두 사용했습니다 }
        reason: { type: string }
        releaseActor: { type: string, enum: [user, operator, legal_expert, system, operator_expert] }
        releaseText: { type: string, example: 시스템 - 10-01 초기화 }
        nextActions:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string, example: switch_to_text }
              label: { type: string }
        eventId: { type: integer }
        detail: { type: object, additionalProperties: true, description: '예: G4 {remaining:0, resetDate}, G2 {checks:[...]}' }

    OpenGate:
      type: object
      required: [gate, title, scope]
      properties:
        gate: { $ref: '#/components/schemas/GateCode' }
        title: { type: string }
        reason: { type: string }
        scope: { type: string, enum: [full, partial] }
        releaseActor: { type: string }
        eventId: { type: integer }

    Quota:
      type: object
      description: 이력(미사용) — 이용 한도는 2026-09-29 부터 없다. 어떤 응답에도 싣지 않는다
      required: [limit, used, remaining, resetDate]
      properties:
        limit: { type: integer, example: 3 }
        used: { type: integer, description: '이번 달 저장된 결과(usage_charge) + 사용자 취소(cancel_charge) 합 — v_quota_effective' }
        remaining: { type: integer }
        resetDate: { type: string, format: date }

    SessionInfo:
      type: object
      description: RBAC(2026-09-29) — 권한 판정 원천은 서버(backend/src/modules/auth/rbac.ts). 로컬 사업자 모드에는 이용 한도가 없어 quota 를 싣지 않는다
      required: [loggedIn, permissions]
      properties:
        loggedIn: { type: boolean }
        user:
          type: object
          nullable: true
          properties:
            userId: { type: integer }
            provider: { type: string, enum: [kakao, naver, dev, local] }
            nickname: { type: string, nullable: true, description: '화면에 보일 이름 — 아이디·비밀번호 계정은 회원가입 때 받은 이름(auth_password.display_name)' }
            role: { type: string, enum: [user, operator, developer, legal_expert] }
        permissions:
          type: array
          description: 역할의 권한(유스케이스 단위). 비로그인이면 빈 배열
          items: { $ref: '#/components/schemas/Permission' }
        authProviders: { type: array, items: { type: string, enum: [kakao, naver, dev] }, description: 로그인 화면에 보일 제공자 }

    PrecheckItem:
      type: object
      required: [check, passed]
      properties:
        check: { type: string, enum: [format, size, pages, encrypted, corrupt] }
        passed: { type: boolean }
        message: { type: string }

    PrecheckResult:
      type: object
      required: [uploadToken, format, checks]
      properties:
        uploadToken: { type: string }
        format: { type: string, enum: [pdf, hwp, hwpx, docx, html] }
        pages: { type: integer, nullable: true }
        sizeBytes: { type: integer }
        checks: { type: array, items: { $ref: '#/components/schemas/PrecheckItem' } }

    AnalysisStatus:
      type: object
      required: [requestId, perspective, knowledgeDate, requestStage, rail, openGates]
      properties:
        requestId: { type: integer }
        perspective: { $ref: '#/components/schemas/Perspective' }
        knowledgeDate: { type: string, format: date }
        requestStage: { type: string, enum: [received, deidentifying, structuring, awaiting_type, type_confirmed, stopped] }
        rail:
          description: FR-024 세부 줄(수신→비식별화→구조화→탐지→근거 검색→설명)
          type: array
          items:
            type: object
            properties:
              step: { type: string, enum: [received, deidentify, structure, detect, search, explain] }
              state: { type: string, enum: [waiting, running, done, blocked, reused] }
        documents:
          type: array
          items:
            type: object
            properties:
              documentId: { type: integer }
              docSeq: { type: integer }
              displayName: { type: string, description: 비식별 처리된 표시명 }
              splitMethod: { type: string, enum: [article, semantic], nullable: true }
              ocrApplied: { type: boolean }
              summaryStatus: { type: string, enum: [ok, unavailable], nullable: true }
              contractTypeCandidate: { $ref: '#/components/schemas/ContractType' }
              contractType: { $ref: '#/components/schemas/ContractType' }
        run:
          type: object
          nullable: true
          properties:
            runId: { type: integer }
            runKind: { type: string, enum: [analysis, reanalysis] }
            stage: { type: string, enum: [detecting, searching, explaining, completed, saved, aborted] }
            clauseTotal: { type: integer }
            scoredCount: { type: integer }
            riskTotal:
              type: integer
              description: 판정(M3) 대상 위험 후보 수. 판정 단계(explaining) 이후에만 싣는다(2026-09-30 진행 중 결과 표시)
            judgedCount: { type: integer, description: 위험 후보 중 판정을 마친 수(분석 불가 포함) }
            judged:
              type: array
              description: 판정을 마친 위험 조항(정상 판정 제외), 판정 순서 = 위험 점수 높은 순. 설명·근거는 결과 화면에서
              items:
                type: object
                required: [clauseId, seq, category]
                properties:
                  clauseId: { type: integer }
                  seq: { type: integer }
                  articleNo: { type: string }
                  paragraphNo: { type: string }
                  itemNo: { type: string }
                  title: { type: string }
                  category: { type: string, enum: [dispute, unfair, illegal] }
                  preview: { type: string, description: 비식별 조항 앞부분(60자) }
            judgedNormalCount: { type: integer, description: 판정 결과 정상인 위험 후보 수 }
        openGates: { type: array, items: { $ref: '#/components/schemas/OpenGate' } }
        elapsedSec: { type: integer, description: 요청 수신 이후 경과 초(진행 화면 표시) }
        modelNotice:
          type: object
          nullable: true
          description: |
            모델 적재·대기 안내(공유 Ollama). cold_start = 이 단계 모델이 메모리에 없어 첫 호출에 적재 시간이 든다,
            queue = 공유 서버에서 앞선 요청을 기다리는 중, loading = 모델 서버가 적재 중
          properties:
            kind: { type: string, enum: [cold_start, queue, loading] }
            model: { type: string, enum: [M1, M2, M3, M4] }
            message: { type: string }
            estimatedSec: { type: integer, nullable: true }
        cancellable: { type: boolean, description: 지금 취소할 수 있는지(received~explaining) }

    ClauseNode:
      type: object
      required: [assessmentId, clauseId, seq, text, displayCategory]
      properties:
        assessmentId: { type: integer }
        clauseId: { type: integer }
        documentId: { type: integer }
        seq: { type: integer }
        articleNo: { type: string, nullable: true }
        paragraphNo: { type: string, nullable: true }
        itemNo: { type: string, nullable: true }
        title: { type: string, nullable: true }
        text: { type: string, description: 비식별 조항 원문(〔유형〕 가림 포함) }
        displayCategory: { $ref: '#/components/schemas/DisplayCategory' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        lowOcrQuality: { type: boolean }
        abstention: { $ref: '#/components/schemas/Abstention' }

    Abstention:
      type: object
      description: '판정 불가(2026-09-30, migration 008) — 잘못된 입력·계약 조항이 아닌 문장·지시문이라 모델을 부르지 않은 조항. displayCategory 는 unanalyzable'
      required: [reason, label]
      properties:
        reason: { type: string, enum: [invalid_input, not_clause, prompt_injection] }
        label: { type: string, example: '계약 조항으로 보기 어렵습니다' }

    ResultView:
      type: object
      required: [runId, requestId, disclaimer, knowledgeDate, perspective, counts, clauses]
      properties:
        runId: { type: integer }
        requestId: { type: integer }
        runKind: { type: string, enum: [analysis, reanalysis] }
        prevRunId: { type: integer, nullable: true }
        disclaimer: { type: string, example: 본 결과는 법률 자문이 아니며 위험 가능성 정보입니다 }
        knowledgeDate: { type: string, format: date }
        analysisBasisVersion: { type: string }
        perspective: { $ref: '#/components/schemas/Perspective' }
        documents:
          type: array
          items:
            type: object
            properties:
              documentId: { type: integer }
              displayName: { type: string }
              contractType: { $ref: '#/components/schemas/ContractType' }
              contractTypeInScope: { type: boolean }
              splitMethod: { type: string, enum: [article, semantic] }
              summary: { type: string, nullable: true, description: 'null 이면 화면 "요약 제공 불가"(C7)' }
              sourceUrl: { type: string, nullable: true }
              collectedAt: { type: string, format: date-time, nullable: true }
        counts:
          type: object
          properties:
            high: { type: integer }
            mid: { type: integer }
            low: { type: integer }
            unanalyzable: { type: integer }
        impactNotice:
          description: C9 근거 변경 안내(로그인 결과에만)
          type: object
          nullable: true
          properties:
            amend: { type: integer }
            repeal: { type: integer }
            newCase: { type: integer }
            stdTermsRevision: { type: integer }
        clauses: { type: array, items: { $ref: '#/components/schemas/ClauseNode' }, description: 원문 순서 }
        riskOrder: { type: array, items: { type: integer }, description: 위험도순 assessmentId 목록 }

    Evidence:
      description: 근거 6항목(FR-021) + 사례 3구분(FR-028)
      type: object
      required: [evidenceVersionId, sourceType, sourceName, identifier, excerpt, sourceUrl]
      properties:
        evidenceVersionId: { type: integer }
        sourceType: { type: string, enum: [law_article, ftc_case, std_terms] }
        sourceName: { type: string }
        identifier: { type: string }
        excerpt: { type: string }
        sourceUrl: { type: string }
        effectiveDate: { type: string, format: date, nullable: true }
        publishedDate: { type: string, format: date, nullable: true }
        caseFacts: { type: string, nullable: true }
        caseJudgment: { type: string, nullable: true }
        caseBasis: { type: string, nullable: true }
        changedSinceAnalysis: { type: boolean, description: C6 "변경됨" 상태 }

    ClauseDetail:
      type: object
      required: [assessmentId, displayCategory, evidence]
      properties:
        assessmentId: { type: integer }
        clause: { $ref: '#/components/schemas/ClauseNode' }
        displayCategory: { $ref: '#/components/schemas/DisplayCategory' }
        riskType: { $ref: '#/components/schemas/RiskType' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        evidenceUnconfirmed: { type: boolean, description: '분쟁 가능 - 근거 미확인(BR-EVD-01 강등)' }
        expertReviewRecommended: { type: boolean }
        explanationAvailable: { type: boolean, nullable: true }
        unanalyzableReason: { type: string, enum: [timeout, server_down], nullable: true }
        abstention: { $ref: '#/components/schemas/Abstention' }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        feedbackTypeAllowed: { type: string, enum: [false_positive, false_negative] }

    Explanation:
      type: object
      required: [available, perspective]
      properties:
        available: { type: boolean }
        perspective: { $ref: '#/components/schemas/Perspective' }
        focus: { type: string, enum: [consumer_disadvantage, business_review_points] }
        claims:
          type: array
          items:
            type: object
            required: [seq, text, evidenceVersionId]
            properties:
              seq: { type: integer }
              text: { type: string }
              evidenceVersionId: { type: integer }
        gate: { $ref: '#/components/schemas/OpenGate' }

    Comparison:
      type: object
      properties:
        clauseText: { type: string }
        law:
          description: 'null 이면 "법령 조문 근거 없음"(UC3 A1) 또는 근거 미확인(A5)'
          allOf: [ { $ref: '#/components/schemas/Evidence' } ]
          nullable: true
        stdTerms:
          description: 'null 이면 "표준약관 대응 조항 없음"(UC3 A2)'
          allOf: [ { $ref: '#/components/schemas/Evidence' } ]
          nullable: true
        businessDiffNotes: { type: array, items: { type: string }, description: 사업자 관점 — 표준약관 대비 차이(UC4 기본흐름 5) }

    FtcCase:
      allOf:
        - $ref: '#/components/schemas/Evidence'

    ResultImpact:
      type: object
      properties:
        kvId: { type: integer }
        knowledgeDate: { type: string, format: date }
        changeKind: { type: string, enum: [amend, repeal, new_case, std_terms_revision] }
        evidenceItemId: { type: integer }
        sourceName: { type: string }
        identifier: { type: string }

    HistoryItem:
      type: object
      properties:
        requestId: { type: integer }
        latestRunId: { type: integer }
        displayName: { type: string }
        requestedAt: { type: string, format: date-time }
        perspective: { $ref: '#/components/schemas/Perspective' }
        knowledgeDate: { type: string, format: date }
        counts: { type: object, properties: { high: { type: integer }, mid: { type: integer }, low: { type: integer } } }
        evidenceChanged: { type: boolean }

    HistoryDetail:
      type: object
      properties:
        requestId: { type: integer }
        displayName: { type: string }
        runs:
          type: array
          items:
            type: object
            properties:
              runId: { type: integer }
              runKind: { type: string, enum: [analysis, reanalysis] }
              prevRunId: { type: integer, nullable: true }
              knowledgeDate: { type: string, format: date }
              savedAt: { type: string, format: date-time }
              evidenceChanged: { type: boolean }

    KnowledgeVersion:
      type: object
      properties:
        kvId: { type: integer }
        kvSeq: { type: integer }
        knowledgeDate: { type: string, format: date }
        analysisBasisVersion: { type: string }
        status: { type: string, enum: [active, superseded] }
        createdAt: { type: string, format: date-time }

    IngestBatch:
      type: object
      properties:
        batchId: { type: integer }
        stage: { type: string, enum: [collecting, collect_failed, preprocessing, selecting, kv_created, impact_identified, deadline_checked] }
        baseKv: { $ref: '#/components/schemas/KnowledgeVersion' }
        sources:
          type: array
          items:
            type: object
            properties:
              agency: { type: string, enum: [law_center, ftc, data_portal, kca] }
              status: { type: string, enum: [ok, failed] }
              failReason: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              itemId: { type: integer }
              agency: { type: string }
              itemTitle: { type: string }
              changeKind: { type: string, enum: [amend, repeal, new_law, new_case, std_terms_revision, reference] }
              decisionLabel: { type: string, enum: [excluded_parse_fail, excluded_repealed, hold_not_effective, reference_only, candidate] }
              include: { type: boolean }
              elapsedDays: { type: integer, nullable: true }
        openGates: { type: array, items: { $ref: '#/components/schemas/OpenGate' } }

    EvalItem:
      type: object
      properties:
        evalItemId: { type: integer }
        clauseTextDeid: { type: string }
        contractType: { $ref: '#/components/schemas/ContractType' }
        goldCategory: { $ref: '#/components/schemas/RiskCategory' }
        origin: { type: string, enum: [new_label, feedback_candidate, synthetic] }
        overlapsTraining: { type: boolean }
        reviewStatus: { type: string, enum: [pending, accepted, rejected] }
        reviewedAt: { type: string, format: date-time, nullable: true }

    EvalMetric:
      type: object
      properties:
        contractType: { $ref: '#/components/schemas/ContractType' }
        clauseCount: { type: integer }
        timeoutExcluded: { type: integer }
        recallPct: { type: number, nullable: true }
        precisionPct: { type: number, nullable: true }
        evidenceFitPct: { type: number, nullable: true, description: 'null = 판정 대기(G11) 또는 측정 불가(G12)' }
        measurable: { type: boolean, nullable: true }

    EvalRun:
      type: object
      properties:
        evalRunId: { type: integer }
        stage: { type: string, enum: [eligibility, inferring, awaiting_expert, result, recorded, aborted] }
        kvId: { type: integer }
        modelVersions: { type: object, properties: { m1: { type: string }, m2: { type: string }, m3: { type: string } } }
        excluded: { type: object, properties: { unreviewed: { type: integer }, synthetic: { type: integer }, trainingOverlap: { type: integer } } }
        metrics: { type: array, items: { $ref: '#/components/schemas/EvalMetric' } }
        warnings:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [bias_gap, below_criteria] }
              message: { type: string }
        confirmable: { type: boolean }
        scConfirmedAt: { type: string, format: date-time, nullable: true }
        openGates: { type: array, items: { $ref: '#/components/schemas/OpenGate' } }

    FeedbackRow:
      type: object
      properties:
        feedbackId: { type: integer }
        feedbackType: { type: string, enum: [false_positive, false_negative] }
        categoryAtSubmit: { $ref: '#/components/schemas/DisplayCategory' }
        knowledgeDate: { type: string, format: date }
        submittedAt: { type: string, format: date-time }
        reviewStatus: { type: string, enum: [unreviewed, reviewed] }
        reviewDecision: { type: string, enum: [valid, invalid, needs_expert], nullable: true }

    FeedbackDetail:
      allOf:
        - $ref: '#/components/schemas/FeedbackRow'
        - type: object
          properties:
            opinionDeid: { type: string, nullable: true }
            targetAvailable: { type: boolean, description: 'false = 결과 삭제됨(UC9 E1) — 대상 표시 불가' }
            clause: { $ref: '#/components/schemas/ClauseNode' }
            judgment: { $ref: '#/components/schemas/ClauseDetail' }
            evidenceChangedSince: { type: boolean }
            gates: { type: array, items: { $ref: '#/components/schemas/OpenGate' } }

    ModelApiStatus:
      type: object
      required: [state, checkedAt]
      properties:
        state: { type: string, enum: [ready, loading, unreachable, auth_mismatch, not_implemented] }
        httpStatus: { type: integer, nullable: true }
        checkedAt: { type: string, format: date-time }
        models:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [M1, M2, M3, M4] }
              name: { type: string }
              loadState: { type: string }
              modelVersion: { type: string }
              trainedDataDate: { type: string, nullable: true }
        gpuMemory: { type: object, description: '통합 메모리(모델 서버 /health gpu 그대로)', properties: { usedMb: { type: integer }, totalMb: { type: integer } } }
        modelChanged:
          description: 9.6 H7 — 현재 model_version 이 최근 결과와 다르면 UC8 권장
          type: object
          nullable: true
          properties:
            currentM3: { type: string }
            recentResultM3: { type: string }
