openapi: 3.0.3
info:
  title: 계약위험탐지서비스 웹 API (Vue 프론트엔드 ↔ Express 백엔드)
  version: 0.2.0
  description: |
    화면 S0~S9(SD_02)가 호출하는 백엔드 REST API. 각 operation 의 `x-ipo` 는 SD_01 IPO 단계,
    `x-gates` 는 그 호출에서 판정·발생할 수 있는 게이트다.

    규약
    - 기본 경로 `/api`. 화면 인증은 세션 쿠키(`crd.sid`, 아이디·비밀번호 로그인 — 전 화면 로그인 필수). 기기 쿠키 `crd_device` 는 폐기(2026-09-29).
    - 외부 프로그램은 `/model/{path}` 를 발급 키(`Authorization: Bearer crd_…`)로 부른다(로그인 세션 불필요).
    - 이용 한도(G4)는 없다(2026-09-29 로컬 사업자 모드부터). `Quota` 스키마는 이력으로만 남긴다.
    - 갱신 2026-10-01(v0.2.0): 한도·취소 차감·소셜 전용 표현 정리, 외부 모델 API 의 허용 경로·요청 제한·근거 검색 없음 명시, 태그 추가.
    - 게이트 차단은 항상 `GateError` 본문으로 응답한다. HTTP 코드 규약(SD_01 §14-2):
      입력 게이트 G2·G3·G6 → 400/422, 자원 게이트 G5 → 503(G4 이용 한도는 현재 미사용),
      권한 게이트 G8 → 401/403/404, G14 → 403, 일관성 게이트 G7 → 409.
      부분 차단 게이트(G1·G9·G10·G11·G12·G13)는 200 응답 안의 `gates[]` 로 전달한다.
    - 응답에 비식별화 전 텍스트·API 키를 싣지 않는다(BR-PRV-01·04, BR-API-02).
    - 결과 계열 응답은 항상 `disclaimer` 와 `knowledgeDate` 를 포함한다(FR-030, C4).
servers:
  - url: /api

tags:
  - name: session
  - name: intake
    description: P1 분석 접수·사전검증 (S1)
  - name: analysis
    description: P2·P3 진행 (S2·S3)
  - name: results
    description: P4 결과 조회·설명 열람 (S4)
  - name: feedback
    description: P5 판정 피드백 (S5)
  - name: history
    description: P6 분석 기록·재분석 (S6)
  - name: admin-knowledge
    description: P0 근거 데이터 갱신 (S0)
  - name: admin-eval
    description: P7 탐지 품질 평가 (S7-O, S7-E)
  - name: admin-feedback
    description: P8 사용자 피드백 검토 (S8)
  - name: admin-model-api
    description: P9 API 활용 안내·서버 상태 (S9)
  - name: model-api-public
    description: 외부 프로그램용 모델 API 프록시 — 발급 키로 호출(2026-09-30)
  - name: api-keys
    description: 이용자별 API 키 발급·폐기(2026-09-30)
  - name: admin-rbac
    description: 역할 × 권한 표(화면 S10 은 2026-09-30 삭제, API 만 유지)

paths:
  # ------------------------------------------------------------------ session
  /session:
    get:
      tags: [session]
      summary: 현재 사용자·역할·권한 목록·로그인 화면 제공자(이용 한도 없음)
      x-ipo: ['1.1']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionInfo' }
  /auth/{provider}/start:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [kakao, naver, dev] } }
      - { name: returnTo, in: query, schema: { type: string }, description: 로그인 후 돌아갈 앱 내부 경로(/ 로 시작) }
    get:
      tags: [session]
      summary: 소셜 로그인 시작(FR-043) — 화면에서는 숨김(2026-09-30, 기본 로그인 = /auth/login). state 쿠키 발급 후 제공자 인가 화면으로 302. dev 는 AUTH_DEV_PROVIDER=true 이고 production 이 아닐 때만(아니면 404)
      responses:
        '302': { description: 제공자 인가 URL 로 이동 }
        '404': { description: 비활성 제공자, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/{provider}/callback:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [kakao, naver, dev] } }
      - { name: code, in: query, schema: { type: string } }
      - { name: state, in: query, schema: { type: string } }
    get:
      tags: [session]
      summary: 인가 코드 교환 → 제공자 식별자만 조회 → auth_identity 조회·생성(role=user) → 세션 재발급 후 returnTo 로 302. 비밀번호·토큰은 저장하지 않는다
      responses:
        '302': { description: 로그인 완료 후 앱으로 이동 }
        '400': { description: state 불일치·코드 누락, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/login:
    post:
      tags: [session]
      summary: 아이디·비밀번호 로그인(2026-09-30) — 세션 재발급. 틀리면 어느 쪽이 틀렸는지 알리지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password]
              properties:
                loginId: { type: string }
                password: { type: string, format: password }
                returnTo: { type: string, description: 로그인 후 돌아갈 앱 내부 경로 }
      responses:
        '200': { description: 로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }
        '401': { description: 아이디 또는 비밀번호 불일치, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/signup:
    post:
      tags: [session]
      summary: 회원가입(2026-09-30) — 사용자(user) 역할로 계정을 만들고 바로 로그인. 운영자 계정은 npm run admin:create-account 로만
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginId, password, name]
              properties:
                loginId: { type: string, description: '영문 소문자·숫자로 시작하는 4~32자(영문·숫자·. _ -)' }
                password: { type: string, format: password, description: 8~72자, 영문과 숫자 포함 }
                name: { type: string, maxLength: 20, description: 화면에 보일 이름 }
                returnTo: { type: string }
      responses:
        '201': { description: 가입·로그인됨, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResult' } } } }
        '400': { description: 입력 형식 오류, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '409': { description: 이미 쓰는 아이디, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/logout:
    post:
      tags: [session]
      responses:
        '204': { description: No Content }
  /meta/codes:
    get:
      tags: [session]
      summary: 코드 값·화면 표기 사전(위험 분류·유형·위험도·신뢰도·계약 유형·가림 유형)과 게이트 문구 사전(SD_02 §14-2)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /meta/privacy-notice:
    get:
      tags: [session]
      summary: 개인정보 처리 방식 고지(FR-010) — 비식별화 대상 8종, 원본 24시간 보관, 삭제 방법
      x-ipo: ['1.1']
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { html: { type: string } } } } } }
  /model-server/status:
    get:
      tags: [session]
      summary: 사용자 화면용 모델 서버 상태(C11) — ready/loading/unreachable 만. 코드별 구분은 S9 전용
      x-ipo: ['1.6']
      x-gates: [G5]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [state, checkedAt]
                properties:
                  state: { type: string, enum: [ready, loading, unreachable] }
                  checkedAt: { type: string, format: date-time }
                  coldStart:
                    type: boolean
                    description: |
                      공유 Ollama 는 keep_alive 5분 뒤 모델을 내린다. true 이면 M3·M4 중 메모리에 올라와 있지 않은
                      모델이 있어 첫 호출에 적재 시간이 더 걸린다(분석은 가능 — G5 아님)
                  warmupEstimateSec: { type: integer, nullable: true, description: '콜드 스타트 예상 추가 시간(초). ready 이고 모두 상주면 null' }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [M1, M2, M3, M4] }
                        state: { type: string, enum: [ready, loading, cold, missing, error] }

  # ------------------------------------------------------------------ intake (P1)
  /intake/uploads:
    post:
      tags: [intake]
      summary: 파일 업로드 + 사전 검사(형식·크기·쪽수·암호화·손상). 원본은 임시 보관(분석 요청 미생성 시 1시간 후 삭제)
      x-ipo: ['1.2', '1.3']
      x-gates: [G2]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 사전 검사 통과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrecheckResult' }
        '400':
          description: G2 파일 조건 미충족(검사 항목별 결과 포함)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/GateError'
                  - type: object
                    properties:
                      checks: { type: array, items: { $ref: '#/components/schemas/PrecheckItem' } }
        '413': { description: 50MB 초과(G2), content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /intake/url-fetches:
    post:
      tags: [intake]
      summary: 약관 게시 웹페이지 본문 수집(원본 URL·수집 시각 기록)
      x-ipo: ['1.4']
      x-gates: [G3]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 1000 }
      responses:
        '201':
          description: 본문 수집 성공
          content:
            application/json:
              schema:
                type: object
                required: [sourceToken, sourceUrl, collectedAt, charCount]
                properties:
                  sourceToken: { type: string }
                  sourceUrl: { type: string }
                  collectedAt: { type: string, format: date-time }
                  charCount: { type: integer }
        '422': { description: G3 로그인 필요·접근 차단·본문 없음, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /analyses:
    post:
      tags: [intake]
      summary: 분석 시작 — 업로드·URL 토큰(G2·G3)과 서버 상태(G5) 확인 후 분석 요청(H1) 생성, 지식 기준일 고정, P2 비동기 시작
      description: |
        G2→G3→G5 를 요청 행을 만들기 **전에** 판정한다(SD_01 §4-3, `intake.service.ts`). 이용 한도(G4)는 확인하지 않는다. 성공 시 진행 상태 "수신".
        관점은 여기서 한 번만 정한다(U7) — 이후 변경 API 는 없다.
      x-ipo: ['1.5', '1.6', '1.7']
      x-gates: [G2, G3, G5]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [perspective, source]
              properties:
                perspective: { $ref: '#/components/schemas/Perspective' }
                source:
                  oneOf:
                    - type: object
                      required: [kind, uploadToken]
                      properties: { kind: { type: string, enum: [file] }, uploadToken: { type: string } }
                    - type: object
                      required: [kind, sourceToken]
                      properties: { kind: { type: string, enum: [url] }, sourceToken: { type: string } }
                    - type: object
                      required: [kind, text]
                      properties: { kind: { type: string, enum: [text] }, text: { type: string, minLength: 1, maxLength: 2000000 } }
      responses:
        '201':
          description: 분석 요청 생성
          content:
            application/json:
              schema:
                type: object
                required: [requestId, knowledgeDate]
                properties:
                  requestId: { type: integer }
                  knowledgeDate: { type: string, format: date }
        '400': { description: 'invalid_body(형식 오류) 또는 G2·G3(만료·없는 토큰)', content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/GateError' }, { $ref: '#/components/schemas/Problem' } ] } } } }
        '503': { description: G5 모델 서버 불가, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }

  # ------------------------------------------------------------------ analysis (P2·P3)
  /analyses/{requestId}:
    parameters: [ { $ref: '#/components/parameters/RequestId' } ]
    get:
      tags: [analysis]
      summary: 진행 상태 폴링(2초) — 레일(C1)·세부 줄(FR-024)·문서별 계약 유형 후보·열린 게이트
      x-ipo: ['2.1-2.6', '3.1-3.8']
      x-gates: [G5, G6, G7, G8]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisStatus' } } } }
        '404': { description: G8 요청 없음·세션 불일치, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /analyses/{requestId}/documents/{documentId}/contract-type:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { name: documentId, in: path, required: true, schema: { type: integer } }
    put:
      tags: [analysis]
      summary: 계약 유형 확인·수정·확정(H2 완성). 요청의 모든 문서가 확정되면 P3 분석 실행 시작
      x-ipo: ['2.6', '3.1']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractType]
              properties:
                contractType: { $ref: '#/components/schemas/ContractType' }
      responses:
        '200': { description: 확정, content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisStatus' } } } }
        '409': { description: 이미 확정됨 또는 G6 으로 중단된 요청, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /analyses/{requestId}/runs/{runId}/save:
    parameters:
      - { $ref: '#/components/parameters/RequestId' }
      - { $ref: '#/components/parameters/RunId' }
    post:
      tags: [analysis]
      summary: "\"결과 보기\" — 결과 저장(H3) + 사용 기록 usage_charge 1건(최초 분석만, 같은 트랜잭션). 한도 확인은 없다"
      x-ipo: ['3.9', '6.7']
      x-gates: [G7, G8]
      responses:
        '200':
          description: 저장됨(멱등 — 이미 saved 이면 그대로 200)
          content:
            application/json:
              schema:
                type: object
                required: [runId, resultUrl]
                properties:
                  runId: { type: integer }
                  resultUrl: { type: string, example: /results/42 }
        '409': { description: 'G7 결과 제공 보류(GateError) 또는 실행 미완료(Problem, code=run_not_completed — 게이트 아님)', content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/GateError' }, { $ref: '#/components/schemas/Problem' } ] } } } }

  /analyses/{requestId}/cancel:
    parameters: [ { $ref: '#/components/parameters/RequestId' } ]
    post:
      tags: [analysis]
      summary: 사용자 분석 취소(FR-035(b)) — received~explaining 단계에서만. 요청 stopped·실행 aborted·대기 조항 unanalyzable, 원본 즉시 삭제 예약(같은 트랜잭션). 취소 차감(cancel_charge)은 기록하지 않는다
      x-ipo: ['INC1']
      x-gates: [G8]
      responses:
        '200':
          description: 취소됨
          content:
            application/json:
              schema:
                type: object
                required: [requestId]
                properties:
                  requestId: { type: integer }
        '409': { description: 이미 completed·saved·stopped — 취소할 수 없음, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ------------------------------------------------------------------ results (P4)
  /results/{runId}:
    parameters: [ { $ref: '#/components/parameters/RunId' } ]
    get:
      tags: [results]
      summary: 결과 화면 진입 — 고지·기준일·관점·요약·계약 유형·위험도별 개수·근거 변경 안내·원문(조항 트리)·위험도순 목록
      x-ipo: ['4.1', '4.2', '4.3']
      x-gates: [G8]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultView' } } } }
        '401': { description: G8 로그인 필요, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
        '403': { description: G8 본인 기록 아님, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
        '404': { description: G8 세션 만료·결과 없음, content: { application/json: { schema: { $ref: '#/components/schemas/GateError' } } } }
  /results/{runId}/clauses/{assessmentId}:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/AssessmentId' }
    get:
      tags: [results]
      summary: 조항 판정 상세(C5) + 근거 목록(C6, 6항목)
      x-ipo: ['4.4', '4.6']
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ClauseDetail' } } } }
  /results/{runId}/clauses/{assessmentId}/explanation:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/AssessmentId' }
    get:
      tags: [results]
      summary: 쉬운 설명(관점별) — 2차 단정 표현 검사, 근거 없는 주장 제외, 필요 시 같은 캐시 키로 1회 재생성
      x-ipo: ['4.8', '4.9']
      x-gates: [G9]
      responses:
        '200':
          description: 설명 또는 G9(부분 차단 — 판정·근거는 계속 제공)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Explanation' }
  /results/{runId}/clauses/{assessmentId}/comparison:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/AssessmentId' }
    get:
      tags: [results]
      summary: 원문 대 법령 조문 / 원문 대 표준약관 비교 보기
      x-ipo: ['4.10']
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Comparison' } } } }
  /results/{runId}/clauses/{assessmentId}/similar-cases:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
      - { $ref: '#/components/parameters/AssessmentId' }
