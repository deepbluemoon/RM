# 계약위험탐지서비스 — macOS Homebrew Nginx 서버 블록 (T147, quickstart §7)
# 설치: cp deploy/nginx/crd.conf /opt/homebrew/etc/nginx/servers/crd.conf && nginx -t && brew services restart nginx
# server_name·인증서 경로는 운영 도메인에 맞게 바꾼다. 인증서는 certbot(Let's Encrypt)로 발급한다.

server {
  listen 80;
  server_name crd.example.kr;
  location /.well-known/acme-challenge/ { root /opt/homebrew/var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name crd.example.kr;

  ssl_certificate     /opt/homebrew/etc/letsencrypt/live/crd.example.kr/fullchain.pem;
  ssl_certificate_key /opt/homebrew/etc/letsencrypt/live/crd.example.kr/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # 업로드 50MB 한도(FR-002) + 여유. 초과는 413 — 화면이 G2 로 안내한다
  client_max_body_size 55m;

  # 요청 본문·쿼리를 접근 로그에 남기지 않는다(FR-009) — 경로만
  log_format crd '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /opt/homebrew/var/log/nginx/crd.access.log crd;

  root /srv/crd/frontend/dist;
  index index.html;

  # 빌드 산출물(해시 파일명)은 길게 캐시, index.html 은 캐시하지 않는다
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri /index.html; }

  location /api/ {
    proxy_pass http://127.0.0.1:9522;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;      # 분석은 비동기(폴링)라 긴 연결이 필요 없다. 업로드 사전 검사만 수십 초
    proxy_request_buffering on;   # 업로드를 다 받은 뒤 앱으로 넘긴다
  }

  # 모델 서버 게이트웨이(9542)·공유 Ollama(11434)는 외부에 열지 않는다 — 백엔드만 127.0.0.1 로 부른다
}
