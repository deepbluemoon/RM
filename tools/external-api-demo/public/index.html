<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유클마켓 회원가입</title>
<!--
  외부 업체(가상) 유클마켓의 회원가입 화면 — 발표 시연용.
  - 실제 기능: 이용약관 「AI 약관 위험 분석」(열면 자동 분석, [이유·근거 보기]는 요청 시) = terms-analysis.js → crd-client.js → 업체 서버(server.mjs) → 공개 API
  - 시연용 UI: 소셜 가입·입력 폼·가입 완료 = signup-mock.js (서버 호출 없음, 저장 없음)
-->
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #191b1f; --muted: #5b6270; --line: #e5e7eb; --field: #ffffff;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: #e6f4f1;
  --ai: #5b3df5; --ai-soft: #f1eeff; --ai-ink: #ffffff;
  --match: #1d4ed8; --hi: #b42318; --hi-soft: #fef0ef; --mid: #b54708; --mid-soft: #fff6e5; --ok: #067647; --ok-soft: #e9f7ef;
  --kakao: #fee500; --kakao-ink: #191600; --naver: #03c75a; --apple: #000000;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --panel: #171a1f; --ink: #eceef2; --muted: #9aa1ad; --line: #2a2e36; --field: #111317;
    --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: #0f2a26;
    --ai: #9d8cff; --ai-soft: #211c3a; --ai-ink: #120d2b;
    --match: #8ab4ff; --hi: #ff8a80; --hi-soft: #3a1917; --mid: #ffb35c; --mid-soft: #37270f; --ok: #5ed39a; --ok-soft: #13301f;
    --apple: #ffffff; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --panel: #171a1f; --ink: #eceef2; --muted: #9aa1ad; --line: #2a2e36; --field: #111317;
  --brand: #2dd4bf; --brand-ink: #04201c; --brand-soft: #0f2a26;
  --ai: #9d8cff; --ai-soft: #211c3a; --ai-ink: #120d2b;
  --match: #8ab4ff; --hi: #ff8a80; --hi-soft: #3a1917; --mid: #ffb35c; --mid-soft: #37270f; --ok: #5ed39a; --ok-soft: #13301f;
  --apple: #ffffff; --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }

/* 머리글 */
.topbar { background: #111; color: #cfd2d8; font-size: 12px; }
.topbar .in { max-width: 1180px; margin: 0 auto; padding: 6px 16px; display: flex; gap: 16px; justify-content: flex-end; }
header.gnb { background: var(--panel); border-bottom: 1px solid var(--line); }
header.gnb .in { max-width: 1180px; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; gap: 24px; }
.logo { font-weight: 900; font-size: 22px; letter-spacing: -.04em; text-decoration: none; }
.logo b { color: var(--brand); }
.gnb nav { display: flex; gap: 20px; color: var(--muted); font-size: 14px; }
.gnb .search { margin-left: auto; flex: 0 1 280px; background: var(--bg); border-radius: 999px; padding: 8px 14px; color: var(--muted); font-size: 13px; }
@media (max-width: 760px) { .gnb nav, .gnb .search { display: none; } }

/* 본문 배치: 가입 카드 | 분석 패널 */
.page { max-width: 1180px; margin: 0 auto; padding: 32px 16px 80px; display: grid; grid-template-columns: minmax(0, 520px); justify-content: center; gap: 24px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.signup { padding: 32px 28px; }
@media (max-width: 520px) { .signup { padding: 24px 18px; } }
h1 { font-size: 26px; letter-spacing: -.03em; margin: 0; }
.sub { color: var(--muted); margin: 6px 0 22px; font-size: 14px; }
.sub b { color: var(--brand); }

/* 소셜 */
.social { display: grid; gap: 8px; }
.social button { height: 48px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.s-kakao { background: var(--kakao); color: var(--kakao-ink); }
.s-naver { background: var(--naver); color: #fff; }
.s-apple { background: var(--panel); border-color: var(--line) !important; }
.social .ic { width: 20px; height: 20px; display: inline-grid; place-items: center; font-weight: 900; font-size: 13px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 22px 0 16px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* 입력 */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; background: var(--field); color: var(--ink); font: inherit; }
.field input:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: transparent; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.field .hint.bad { color: var(--hi); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.btn-line { height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; font-size: 14px; }

/* 약관 동의 */
/* 가입 단계 */
.stepper { list-style: none; display: flex; gap: 6px; margin: -8px 0 22px; padding: 0; counter-reset: none; }
.stepper li { flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 600; }
.stepper li .no { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--line); color: var(--muted); flex: none; }
.stepper li[aria-current="step"] { background: var(--brand-soft); color: var(--brand); }
.stepper li[aria-current="step"] .no, .stepper li.done .no { background: var(--brand); color: var(--brand-ink); }
.stepper li.done { color: var(--ink); }
.step-title { font-size: 17px; margin: 0 0 14px; letter-spacing: -.02em; }
.step[hidden] { display: none; }
.step-actions { display: flex; gap: 8px; margin-top: 22px; }
.step-actions .prev { height: 54px; padding: 0 22px; border-radius: 12px; font-weight: 700; }
.step-actions .submit { margin-top: 0; flex: 1; }
.agree-sub { display: flex; gap: 16px; padding: 0 14px 12px 48px; font-size: 13px; color: var(--muted); }
.agree-sub label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 24px; }
.agree-sub input { width: 20px; height: 20px; accent-color: var(--brand); }
.agree { border: 1px solid var(--line); border-radius: 12px; margin-top: 22px; }
.agree-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.agree-row + .agree-row, .agree-row + .terms-wrap, .terms-wrap + .agree-row { border-top: 1px solid var(--line); }
.agree-all { background: var(--bg); border-radius: 12px 12px 0 0; font-weight: 700; }
.agree-row label { flex: 1; cursor: pointer; font-size: 14px; }
.agree-row .req { color: var(--brand); font-weight: 700; margin-right: 4px; }
.agree-row .opt { color: var(--muted); margin-right: 4px; }
.agree input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--brand); flex: none; cursor: pointer; }
.linkbtn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 4px 2px; min-height: 24px; }

/* 이용약관 + AI 분석 진입 */
.terms-wrap { padding: 0 14px 14px; }
.btn-ai { background: var(--ai); color: var(--ai-ink); border: 0; border-radius: 10px; height: 38px; padding: 0 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn-ai:disabled { opacity: .6; cursor: default; }
.terms-box { margin-top: 14px; height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.7; background: var(--field); scroll-behavior: smooth; }
.terms-box[hidden] { display: none; }
.terms-box h4 { font-size: 15px; margin: 0 0 8px; }
.terms-box h5 { font-size: 13px; margin: 14px 0 4px; color: var(--muted); }
.terms-box p { margin: 0 0 8px; padding: 4px 6px; border-radius: 6px; border-left: 3px solid transparent; transition: background .4s; }
.terms-box p.risk-hi { background: var(--hi-soft); border-left-color: var(--hi); }
.terms-box p.risk-mid { background: var(--mid-soft); border-left-color: var(--mid); }
.terms-box p.flash { outline: 2px solid var(--ai); }
.terms-box .tag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--panel); border: 1px solid currentColor; }
.terms-box .risk-hi .tag { color: var(--hi); } .terms-box .risk-mid .tag { color: var(--mid); }

.submit { margin-top: 22px; width: 100%; height: 54px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); font-size: 16px; font-weight: 800; cursor: pointer; }
.submit:disabled { background: var(--line); color: var(--muted); cursor: default; }
.foot-note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 16px; }
.foot-note a { display: inline-block; min-height: 24px; padding: 3px 2px; }


/* AI 약관 분석(가입 창 안) */
.ai-box { margin-top: 22px; }
.ai-box + .agree { margin-top: 12px; }
.terms-wrap[hidden] { display: none; }
.ai-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin: 12px 0 8px; }
.ai-head .spark { width: 22px; height: 22px; border-radius: 7px; background: var(--ai); color: var(--ai-ink); display: grid; place-items: center; font-size: 12px; flex: none; }
.ai-head .by { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted); }
.ai-head .brand { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }

.ai-head .readme-logo { height: 28px; }
.ai-banner .readme-logo { height: 17px; }
/* 상단 요약 배너(ReadMe) — 결과로 이동 */
.ai-banner { display: flex; align-items: center; gap: 10px; margin: -6px 0 18px; padding: 10px 12px; border-radius: 12px; background: var(--ai-soft); font-size: 13.5px; line-height: 1.45; }
.ai-banner[hidden] { display: none; }
.ai-banner .spark { width: 26px; height: 26px; border-radius: 8px; background: var(--ai); color: var(--ai-ink); display: grid; place-items: center; font-size: 13px; flex: none; }
.ai-banner .txt { flex: 1; min-width: 0; }
.ai-banner .txt b { font-weight: 800; }
.ai-banner .go { flex: none; border: 0; border-radius: 8px; background: var(--ai); color: var(--ai-ink); font-weight: 700; font-size: 13px; padding: 7px 12px; cursor: pointer; }
.ai-banner.hi { background: var(--hi-soft); } .ai-banner.hi .spark, .ai-banner.hi .go { background: var(--hi); color: #fff; }
/* 원문 보기 — 오른쪽 옆 창(휴대폰은 화면 전체) */
.src-panel { position: fixed; inset: 0 0 0 auto; width: min(var(--src-w, 760px), 100%); z-index: 60; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); display: flex; flex-direction: column; }
.src-panel[hidden] { display: none; }
.src-panel header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.src-panel header h2 { font-size: 15px; margin: 0; flex: 1; min-width: 0; }
.src-panel header a { font-size: 12px; color: var(--muted); }
.src-panel .close { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 18px; line-height: 1; }
.src-panel .frame-wrap { flex: 1; position: relative; overflow: hidden; background: #fff; }
.src-panel .frame-wrap iframe { position: absolute; top: 0; left: 0; border: 0; background: #fff; width: calc(100% / var(--z, 1)); height: calc(100% / var(--z, 1)); transform: scale(var(--z, 1)); transform-origin: 0 0; }
.src-panel .zoom { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 2px; }
.src-panel .zoom button { min-width: 28px; height: 28px; border: 0; border-radius: 8px; background: none; cursor: pointer; font-size: 16px; color: var(--ink); }
.src-panel .zoom button:hover { background: var(--bg); }
.src-panel .zoom output { min-width: 42px; text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.src-panel .resize { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 1; }
.src-panel .resize::after { content: ""; position: absolute; left: 3px; top: 50%; width: 4px; height: 44px; margin-top: -22px; border-radius: 4px; background: var(--line); }
.src-panel .resize:hover::after, .src-panel .resize:focus-visible::after { background: var(--ai); }
.src-panel.dragging iframe { pointer-events: none; }
@media (max-width: 600px) { .src-panel .resize { display: none; } }
.src-panel .src-note { padding: 16px; font-size: 14px; line-height: 1.6; }
.src-panel .src-note p { margin: 0 0 10px; }
.btn-src { display: inline-flex; align-items: center; margin-top: 6px; min-height: 24px; padding: 3px 9px; border: 0; border-radius: 7px; background: var(--ai-soft); color: var(--ai); font-size: 12px; font-weight: 700; cursor: pointer; }
.btn-src:hover { background: color-mix(in srgb, var(--ai) 16%, var(--ai-soft)); }
.btn-src:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
.why .ev-item .btn-src { display: flex; width: fit-content; }
.why .ev-item .btn-src span { color: inherit; font-size: 11px; }
/* 설명 문장 강조 어절 */
mark.em { background: none; color: var(--hi); font-weight: 700; }
/* 근거 본문 중 AI 설명의 빨간 핵심어와 같은 말(빨강 ↔ 파랑 짝) */
mark.match { background: none; color: var(--match); font-weight: 700; }
.why-load { flex-wrap: wrap; }
.why-load .wait-note { flex-basis: 100%; padding-left: 22px; font-size: 12px; }
.ai-load { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; background: var(--ai-soft); font-size: 14px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ai); border-top-color: transparent; animation: spin .8s linear infinite; flex: none; }
.spin.sm { width: 14px; height: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .spin { animation: none; } }
.btn-why { background: var(--ai-soft); color: var(--ai); border: 0; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-why[aria-expanded="true"] { background: var(--bg); color: var(--muted); }
.why { margin-top: 10px; border-radius: 10px; padding: 12px; background: var(--bg); font-size: 13px; }
.why-load { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.why .lead { font-weight: 700; margin-bottom: 6px; }
.why ul { margin: 0; padding-left: 18px; }
.why li { margin: 4px 0; }
.why .ev { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.why .ev-h { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.why .ev-item { margin: 6px 0; }
.why .ev-item b { display: block; font-size: 12.5px; }
.why .ev-item span { color: var(--muted); font-size: 12px; }
.why .plains { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--ai-soft); font-size: 13px; line-height: 1.55; }
.why .plains .h { font-weight: 800; font-size: 12px; color: var(--ai); margin-bottom: 4px; }
.why .plains p { margin: 4px 0 0; }
.why .plains p b { font-weight: 700; }
.why .plain { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--ai-soft); color: var(--ink); font-size: 13px; line-height: 1.55; }
.why .plain em { display: block; font-style: normal; font-weight: 700; font-size: 11.5px; color: var(--ai); margin-bottom: 2px; }
.why .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
.verdict { border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.verdict.hi { background: var(--hi-soft); } .verdict.mid { background: var(--mid-soft); } .verdict.ok { background: var(--ok-soft); }
.verdict .big { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.verdict p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.kpis div { background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.kpis b { display: block; font-size: 20px; color: var(--ink); }

.risk { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
.risk-top { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; list-style: none; border-radius: 12px; }
.risk-top::-webkit-details-marker { display: none; }
.risk-top:hover { background: var(--bg); }
.risk-top:focus-visible { outline: 2px solid var(--ai); outline-offset: -2px; }
.risk-top h3 { font-size: 15px; margin: 0; flex: 1; min-width: 0; }
.risk-top .chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 6px; transition: transform .2s; flex: none; }
.risk[open] > .risk-top .chev { transform: rotate(-135deg); margin-bottom: -2px; }
.risk[open] > .risk-top { border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; }
.risk-body { padding: 4px 14px 14px; }
.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip.hi { background: var(--hi-soft); color: var(--hi); } .chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.off { background: var(--bg); color: var(--muted); }
.chip.ai { background: var(--ai-soft); color: var(--ai); }
blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .meters { grid-template-columns: 1fr; } }
.meter { font-size: 12px; }
.meter .lbl { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); }
.meter .lbl b { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter .track { height: 6px; border-radius: 99px; background: var(--bg); margin: 4px 0 3px; overflow: hidden; }
.meter .track i { display: block; height: 100%; border-radius: 99px; }
.meter .track i.hi { background: var(--hi); } .meter .track i.mid { background: var(--mid); } .meter .track i.ok { background: var(--ok); }
.meter .what { color: var(--muted); }
.explain { margin-top: 12px; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.explain .h { font-weight: 700; display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.explain ul { margin: 0; padding-left: 18px; }
.explain li { margin: 4px 0; }
.explain .src { color: var(--muted); font-size: 12px; }
.explain.wait { color: var(--muted); }
.risk-actions { margin-top: 10px; display: flex; gap: 12px; }

.ai-mini-wrap { padding-top: 0; }
.ai-mini { border: 1px dashed color-mix(in srgb, var(--ai) 45%, var(--line)); border-radius: 12px; padding: 10px 12px; }
.ai-mini .mini-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; font-weight: 700; }
.ai-mini .mini-head .readme-logo { height: 18px; }
.ai-mini .beta { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); }
.ai-mini .mini-note { margin: 4px 0 8px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.ai-mini .risk { margin-bottom: 6px; }
.ai-mini .mini-safe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 2px 2px; font-size: 13px; }
.safe-list { border: 1px solid var(--line); border-radius: 12px; margin: 4px 0 8px; }
.safe-list > summary { display: flex; align-items: center; gap: 8px; padding: 12px 14px; cursor: pointer; list-style: none; font-size: 14px; font-weight: 600; min-height: 24px; }
.safe-list > summary::-webkit-details-marker { display: none; }
.safe-list ul { list-style: none; margin: 0; padding: 0 14px 4px; }
.safe-list li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.safe-list li b { flex: 1; min-width: 140px; font-weight: 600; }
.safe-list .disclaimer { padding: 0 14px 12px; }
details.all { margin-top: 14px; font-size: 13px; }
details.all summary { cursor: pointer; color: var(--muted); min-height: 24px; padding: 3px 0; }
.tbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
.disclaimer { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.go-agree { margin-top: 14px; width: 100%; height: 48px; border-radius: 12px; border: 0; background: var(--ink); color: var(--panel); font-weight: 700; cursor: pointer; }
.err { background: var(--hi-soft); color: var(--hi); border-radius: 10px; padding: 12px; font-size: 14px; }
.intro { font-size: 14px; color: var(--muted); }

/* 시연용 표시 · 토스트 · 모달 */
.demo-ribbon { position: fixed; left: 12px; bottom: 12px; z-index: 30; font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
@media (max-width: 600px) { .demo-ribbon { position: static; display: block; width: fit-content; margin: 0 auto 24px; } }
.ribbon-btn { border: 0; background: none; padding: 5px 2px; margin: -5px 0; color: var(--ai); font: inherit; text-decoration: underline; cursor: pointer; }
.phone-bg { position: fixed; inset: 0; z-index: 70; background: rgba(15,17,21,.55); display: grid; place-items: center; padding: 12px; }
.phone-bg[hidden] { display: none; }
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; transform-origin: center; }
.phone-bar { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; }
.phone-bar .close { width: 32px; height: 32px; border-radius: 10px; border: 0; background: rgba(255,255,255,.18); color: #fff; font-size: 18px; cursor: pointer; }
.phone { width: 414px; height: 868px; border: 12px solid #111; border-radius: 44px; overflow: hidden; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.phone iframe { width: 100%; height: 100%; border: 0; display: block; }
html.embedded .demo-ribbon, html.embedded .top-mobile { display: none; }
.topbar .in { align-items: center; }
.top-mobile { display: inline-grid; place-items: center; width: 26px; height: 26px; margin: -5px 0; border: 0; border-radius: 7px; background: none; color: #cfd2d8; cursor: pointer; }
.top-mobile:hover { background: rgba(255,255,255,.14); color: #fff; }
.top-mobile:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.demo-ribbon a { color: var(--ai); display: inline-block; padding: 5px 2px; margin: -5px 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; text-align: center; }
.modal .ok { width: 56px; height: 56px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 28px; margin: 0 auto 12px; }
.modal h3 { margin: 0 0 6px; font-size: 20px; }
.modal p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="topbar"><div class="in"><button type="button" class="top-mobile" id="btnMobile" aria-label="모바일 화면으로 보기" title="모바일 화면으로 보기"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg></button><span>고객센터</span><span>주문조회</span><span>로그인</span></div></div>
<header class="gnb">
  <div class="in">
    <a class="logo" href="/">유클<b>마켓</b></a>
    <nav><span>베스트</span><span>신상품</span><span>오늘의 특가</span><span>멤버십</span></nav>
    <div class="search">찾으시는 상품을 검색해 보세요</div>
  </div>
</header>

<main class="page" id="page">
  <!-- ① 회원가입 (시연용 UI — signup-mock.js). 실제 쇼핑몰처럼 ① 약관 동의 → ② 정보 입력 → ③ 가입 완료 -->
  <section class="card signup" aria-labelledby="t-signup">
    <h1 id="t-signup">회원가입</h1>
    <p class="sub">지금 가입하면 <b>첫 구매 3,000원 쿠폰</b>을 드려요</p>
    <ol class="stepper" id="stepper" aria-label="가입 단계">
      <li data-step="1" aria-current="step"><span class="no">1</span>약관 동의</li>
      <li data-step="2"><span class="no">2</span>정보 입력</li>
      <li data-step="3"><span class="no">3</span>가입 완료</li>
    </ol>

    <form id="signupForm" novalidate>
      <!-- 1단계 · 약관 동의 -->
      <div class="step" id="step1">
        <h2 class="step-title">약관에 동의해 주세요</h2>
        <!-- 상단 요약 배너(실제 기능 — terms-analysis.js): 분석이 끝나면 한 줄 요약 + 결과로 이동 -->
        <div class="ai-banner" id="aiBanner" role="status" hidden></div>
        <!-- ③ ReadMe 약관 위험 분석(실제 기능 — terms-analysis.js): 화면을 열면 자동 분석 -->
        <div class="ai-box" id="aiResult"></div>

        <!-- ② 약관 동의 -->
      <div class="agree" id="agree">
        <div class="agree-row agree-all"><input type="checkbox" id="a-all"><label for="a-all">전체 동의하기 <span class="opt" style="font-weight:400">(선택 항목 포함)</span></label></div>
        <div class="agree-row"><input type="checkbox" id="a-age" data-req><label for="a-age"><span class="req">[필수]</span>만 14세 이상입니다</label></div>
        <div class="agree-row" id="agree-terms-row"><input type="checkbox" id="a-terms" data-req><label for="a-terms"><span class="req">[필수]</span>유클마켓 이용약관 동의</label><button type="button" class="linkbtn" id="btnTermsToggle" aria-expanded="false" aria-controls="termsBox">보기</button></div>
        <div class="terms-wrap" hidden>
          <div class="terms-box" id="termsBox" hidden tabindex="0" aria-label="유클마켓 이용약관 전문"><p class="intro">약관을 불러오는 중…</p></div>
        </div>
        <div class="agree-row"><input type="checkbox" id="a-privacy" data-req><label for="a-privacy"><span class="req">[필수]</span>개인정보 수집·이용 동의</label><button type="button" class="linkbtn" id="btnPrivacyToggle" aria-expanded="false" aria-controls="privacyBox">보기</button></div>
        <!-- 개인정보 동의 시험 분석(실제 기능 — terms-analysis.js). 모델 학습 범위 밖이라 「시험 기능」으로 표시 -->
        <div class="terms-wrap ai-mini-wrap"><div class="ai-mini" id="aiPrivacy"></div>
          <div class="terms-box" id="privacyBox" hidden tabindex="0" aria-label="유클마켓 개인정보 수집·이용 동의 전문"></div></div>
        <div class="agree-row"><input type="checkbox" id="a-mkt"><label for="a-mkt"><span class="opt">[선택]</span>할인·이벤트 정보 수신 동의</label></div>
        <div class="agree-sub"><label><input type="checkbox" id="a-mkt-sms" data-mkt> 문자</label><label><input type="checkbox" id="a-mkt-email" data-mkt> 이메일</label></div>
      </div>

        <button type="button" class="submit" id="btnNext" disabled>다음</button>
      </div>

      <!-- 2단계 · 정보 입력(시연용 — 서버로 보내지 않음) -->
      <div class="step" id="step2" hidden>
        <h2 class="step-title">가입 정보를 입력해 주세요</h2>
        <div class="field"><label for="f-id">아이디</label><div class="inline"><input id="f-id" type="text" placeholder="영문 소문자·숫자 4~20자" autocomplete="off" maxlength="20"><button type="button" class="btn-line" id="btnIdCheck">중복 확인</button></div></div>
        <div class="field"><label for="f-pw">비밀번호</label><input id="f-pw" type="password" placeholder="영문·숫자 포함 8자 이상" autocomplete="new-password"><div class="hint" id="h-pw">영문·숫자를 포함해 8자 이상</div></div>
        <div class="field"><label for="f-pw2">비밀번호 확인</label><input id="f-pw2" type="password" autocomplete="new-password"><div class="hint" id="h-pw2"></div></div>
        <div class="field"><label for="f-name">이름</label><input id="f-name" type="text" autocomplete="off"></div>
        <div class="field"><label for="f-phone">휴대폰 번호</label><div class="inline"><input id="f-phone" type="tel" placeholder="010-0000-0000" autocomplete="off"><button type="button" class="btn-line" id="btnOtp">인증번호 받기</button></div></div>
        <div class="field"><label for="f-email">이메일</label><input id="f-email" type="email" placeholder="example@email.com" autocomplete="off"></div>
        <div class="field"><label for="f-birth">생년월일 <span class="opt" style="font-weight:400">(선택)</span></label><input id="f-birth" type="text" inputmode="numeric" placeholder="예: 19990101" maxlength="8" autocomplete="off"></div>
        <div class="step-actions">
          <button type="button" class="btn-line prev" id="btnPrev">이전</button>
          <button type="submit" class="submit" id="btnSubmit" disabled>가입하기</button>
        </div>
      </div>
    </form>
  </section>

</main>

<!-- 근거 원문 옆 창(실제 기능 — terms-analysis.js) -->
<aside class="src-panel" id="srcPanel" hidden role="dialog" aria-modal="false" aria-labelledby="srcTitle">
  <div class="resize" id="srcResize" role="separator" aria-orientation="vertical" aria-label="원문 창 너비 조절 (좌우 방향키)" tabindex="0"></div>
  <header><h2 id="srcTitle">근거 원문</h2><span class="zoom" id="srcZoom" aria-label="원문 확대·축소"><button type="button" data-z="-1" aria-label="작게">−</button><output id="srcZoomVal">100%</output><button type="button" data-z="1" aria-label="크게">+</button></span><a id="srcNewTab" href="#" target="_blank" rel="noopener">새 창으로</a><button type="button" class="close" id="srcClose" aria-label="원문 닫기">×</button></header>
  <div id="srcBody" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</aside>

<div class="demo-ribbon" id="demoRibbon">시연용 가상 서비스 · 약관 분석만 실제 API · <a href="/developers">개발자용 화면</a></div>

<!-- 모바일 미리보기(시연용) — 같은 화면을 휴대폰 크기(390×844) 틀에 띄운다 -->
<div class="phone-bg" id="phoneBg" hidden role="dialog" aria-modal="true" aria-label="모바일 화면 미리보기">
  <div class="phone-wrap">
    <div class="phone-bar"><span>모바일 화면 · 390 × 844</span><button type="button" class="close" id="phoneClose" aria-label="모바일 화면 닫기">×</button></div>
    <div class="phone"><iframe id="phoneFrame" title="모바일 화면"></iframe></div>
  </div>
</div>

<script type="module" src="signup-mock.js"></script>
<script type="module" src="terms-analysis.js"></script>
</body>
</html>
