# 이미지 4개(fe·be·ms·ol) amd64·arm64 빌드·확인(#84) — 규칙: docs/docker-image-policy.md
# - PR·main: 각 플랫폼의 네이티브 러너에서 빌드하고 compose 로 컨테이너를 띄워 확인한다. push 하지 않는다.
#   ol(임베딩 전용 ollama)은 빌드 중 bge-m3 를 받아 구우므로(baked) 각 아키텍처 네이티브 러너에서 돈다(QEMU 아님).
# - Docker Hub push: 수동 실행(workflow_dispatch)에서 push 를 켰을 때만. main 에서 날짜 태그
#   <약어>-YYYYMMDD 와 이동 태그 <약어>-latest 를 발행한다. 날짜 태그는 덮어쓰지 않는다.
# - 필요한 Secrets(관리자 등록): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN(moonsangjin/tamji 쓰기 권한 접근 토큰)
name: images

on:
  pull_request:
    paths:
      - frontend/**
      - backend/**
      - model-server/**
      - ollama/**
      - shared/**
      - specs/002-contract-risk-detection/contracts/**
      - compose.yaml
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - backend/**
      - model-server/**
      - ollama/**
      - shared/**
      - specs/002-contract-risk-detection/contracts/**
      - compose.yaml
      - .github/workflows/images.yml
  workflow_dispatch:
    inputs:
      push:
        description: Docker Hub 에 날짜 버전 이미지(fe/be/ms/ol)를 올린다
        type: boolean
        default: false
      release:
        description: 필수 발행일 YYYYMMDD (예 20261103), main 에서만 허용
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: moonsangjin/tamji

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
    steps:
      - name: push 조건 확인
        if: env.PUSH == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then echo "::error::Secrets DOCKERHUB_USERNAME·DOCKERHUB_TOKEN 이 없습니다"; exit 1; fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::날짜 릴리스는 main 에서만 올린다"; exit 1; }
          echo "$RELEASE" | grep -Eq '^[0-9]{8}$' || { echo "::error::발행일 형식은 YYYYMMDD (예: 20261103)"; exit 1; }

      - uses: actions/checkout@v4

      # 모델 가중치(약 886MB)는 LFS — 실행마다 받으면 LFS 대역폭을 크게 쓰므로 캐시한다
      - name: LFS 목록
        run: git lfs ls-files --long > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
      - name: LFS 받기
        run: git lfs pull

      - name: 디스크 확보
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: docker/setup-buildx-action@v3

      # 확인용으로 로컬에 적재(tamji-ci:<약어>-ci) — compose.yaml 이 TAMJI_IMAGE·TAMJI_VERSION 으로 이 이미지를 쓴다
      - name: build fe
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: tamji-ci:fe-ci
          load: true
          cache-from: type=gha,scope=fe-${{ matrix.arch }}
          cache-to: type=gha,scope=fe-${{ matrix.arch }},mode=max
      - name: build be
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: tamji-ci:be-ci
          load: true
          cache-from: type=gha,scope=be-${{ matrix.arch }}
          cache-to: type=gha,scope=be-${{ matrix.arch }},mode=max
      - name: build ms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: model-server/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: tamji-ci:ms-ci
          load: true
          cache-from: type=gha,scope=ms-${{ matrix.arch }}
          cache-to: type=gha,scope=ms-${{ matrix.arch }},mode=max
      - name: build ol
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ollama/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: tamji-ci:ol-ci
          load: true
          cache-from: type=gha,scope=ol-${{ matrix.arch }}
          cache-to: type=gha,scope=ol-${{ matrix.arch }},mode=max

      # compose.yaml 로 네 컨테이너를 띄운다. 비밀값은 실행마다 새로 만든 시험값, Vertex 인증은 빈 파일(M3·M4 는 error 가 정상)
      - name: compose 기동
        run: |
          echo '{}' > "$RUNNER_TEMP/gcp.json"
          {
            echo "TAMJI_IMAGE=tamji-ci"
            echo "TAMJI_VERSION=ci"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "RAW_FILE_KEY=$(openssl rand -hex 32)"
            echo "MODEL_API_KEY=$(openssl rand -hex 16)"
            echo "GCP_CREDENTIALS_FILE=$RUNNER_TEMP/gcp.json"
          } > .env
          docker compose up -d
      - name: 확인 — 백엔드 healthy·초기화 완료
        run: |
          # 컨테이너는 서비스 이름으로 찾는다(프로젝트 이름이 바뀌어도 그대로 동작 — #126)
          cid() { docker compose ps -aq "$1"; }
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(cid backend)" 2>/dev/null)" = healthy ] && break
            sleep 5
          done
          docker compose ps -a
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$(cid backend-init)")" = 0 ]
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(cid backend)")" = healthy ]
      - name: 확인 — 프런트 → 백엔드
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/api/session | tee /dev/stderr | grep -q '"loggedIn"'
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="app"'
      - name: 확인 — 모델 서버 M1·M2 실모델·추론
        run: |
          docker compose exec -T model-server python - <<'EOF'
          import json, os, time, urllib.error, urllib.request as u
          H = {"Authorization": "Bearer " + os.environ["MODEL_API_KEY"], "Content-Type": "application/json"}
          def call(path, body=None):
              req = u.Request("http://127.0.0.1:9542" + path, headers=H, data=json.dumps(body).encode() if body else None)
              try:
                  with u.urlopen(req, timeout=30) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:  # M3·M4 가 준비되지 않으면 /health 는 503(degraded) — 본문으로 판단한다
                  return e.code, json.load(e)
          for _ in range(60):
              _, h = call("/health")
              if h["status"] != "loading":
                  break
              time.sleep(5)
          m = {x["id"]: x for x in h["models"]}
          print(json.dumps(m, ensure_ascii=False))
          for mid in ("M1", "M2"):
              # 가중치가 LFS 포인터면 heuristic 으로 동작하고 size_mb 가 없다
              assert m[mid]["state"] == "ready" and (m[mid]["size_mb"] or 0) > 300, f"{mid} 실모델 아님: {m[mid]}"
          s, r = call("/v1/detect/loophole", {"contract_type": "ecommerce", "clauses": [{"clause_id": "c1", "text": "회사는 어떠한 경우에도 책임을 지지 않습니다."}]})
          assert s == 200 and r["results"][0]["clause_id"] == "c1", (s, r)
          print("M1 추론", r["model_version"], r["results"][0]["score"])
          EOF
      - name: 확인 — 임베딩 ollama·초기 벡터 적재(하이브리드 RAG)
        run: |
          # 컨테이너는 서비스 이름으로 찾는다(프로젝트 이름이 바뀌어도 그대로 동작 — #126)
          cid() { docker compose ps -aq "$1"; }
          # bge-m3 를 구운 ollama 가 healthy
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(cid ollama)" 2>/dev/null)" = healthy ] && break
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$(cid ollama)")" = healthy ]
          # 1회성 backend-embed 가 끝날 때까지 기다렸다가 종료코드 0 확인(M3·M4 Vertex 없이도 임베딩은 동작)
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Status}}' "$(cid backend-embed)" 2>/dev/null)" = exited ] && break
            sleep 5
          done
          docker compose ps -a
          docker logs "$(cid backend-embed)"
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$(cid backend-embed)")" = 0 ]
          # 초기 근거 벡터가 빠짐 없이 적재됐는지 — embed-evidence 출력의 "남은 것 0"
          docker logs "$(cid backend-embed)" 2>&1 | grep -q '남은 것 0'

      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: compose 정리
        if: always()
        run: docker compose down -v || true

      # push: 플랫폼별 이미지를 digest 로만 올리고(태그 없음), merge 에서 두 플랫폼을 한 태그로 묶는다
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: push fe
        id: push-fe
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=fe-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: push be
        id: push-be
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=be-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: push ms
        id: push-ms
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: model-server/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=ms-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: push ol
        id: push-ol
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ollama/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=ol-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: digest 기록
        if: env.PUSH == 'true'
        run: |
          mkdir -p digests
          echo "${{ steps.push-fe.outputs.digest }}" > digests/fe-${{ matrix.arch }}
          echo "${{ steps.push-be.outputs.digest }}" > digests/be-${{ matrix.arch }}
          echo "${{ steps.push-ms.outputs.digest }}" > digests/ms-${{ matrix.arch }}
          echo "${{ steps.push-ol.outputs.digest }}" > digests/ol-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: env.PUSH == 'true'
        with:
          name: digests-${{ matrix.arch }}
          path: digests/
          retention-days: 7

  merge:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 두 플랫폼을 한 태그로
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          exists() { docker buildx imagetools inspect "$IMAGE:$1" >/dev/null 2>&1; }
          {
            echo "## Docker Hub push"
            echo "소스 커밋 \`$GITHUB_SHA\`"
            echo
            echo "| 태그 | digest(멀티 아키텍처) |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for s in fe be ms ol; do
            exists "$s-$RELEASE" && { echo "::error::$s-$RELEASE 가 이미 있다(날짜 태그 덮어쓰기 금지)"; exit 1; }
            tags=(-t "$IMAGE:$s-$RELEASE" -t "$IMAGE:$s-latest")
            docker buildx imagetools create "${tags[@]}" "$IMAGE@$(cat digests/$s-amd64)" "$IMAGE@$(cat digests/$s-arm64)"
            digest=$(docker buildx imagetools inspect "$IMAGE:$s-$RELEASE" --format '{{json .Manifest}}' | jq -r .digest)
            echo "| \`$s-$RELEASE\` · \`$s-latest\` | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done
      # 팀 알림 자리 — 채널(웹훅)이 정해지면 Secrets 에 넣고 이 단계에서 보낸다(#84)
      - name: 알림
        run: echo "알림 채널 미정 — 결과는 실행 요약(Summary)에 남긴다"
