# 개발용 덮어쓰기 — compose.yaml 위에 겹쳐 쓴다.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# 저장소 소스로 이미지를 직접 빌드하고(로컬 태그 tamji-local/*), 개발용 로그인 API 와 디버깅용 포트를 연다.
# Docker Hub 에 아직 이미지가 없을 때도 이 파일로 실행할 수 있다.

services:
  model-server:
    image: tamji-local/model-server:dev
    build:
      context: .
      dockerfile: model-server/Dockerfile

  backend-init:
    image: tamji-local/backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile

  backend:
    image: tamji-local/backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # development 에서만 개발용 로그인이 켜진다. 로그인 화면에는 버튼이 없고 주소로 들어간다:
      #   http://localhost:<FRONTEND_PORT>/api/auth/dev/start?devSubject=<아무 이름>  (사용자 권한)
      NODE_ENV: development
      AUTH_DEV_PROVIDER: "true"
      LOG_LEVEL: debug
    ports:
      # 디버깅용 — 이 PC 에서만
      - "127.0.0.1:${DEV_BACKEND_PORT:-19522}:9522"

  frontend:
    image: tamji-local/frontend:dev
    build:
      context: .
      dockerfile: frontend/Dockerfile

  mariadb:
    ports:
      # DB 도구로 직접 보려면 — 이 PC 에서만. 로컬에 설치한 MariaDB(3306)와 겹치지 않게 13306
      - "127.0.0.1:${DEV_DB_PORT:-13306}:3306"
