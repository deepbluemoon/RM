# 운영용 덮어쓰기 — compose.yaml 위에 겹쳐 쓴다(#83).
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# 배포 환경(서버 사양·도메인·TLS)이 정해지기 전의 최소 구성이다. 확실한 운영 설정만 넣고,
# 환경에 따라 달라지는 값은 .env 변수로 둔다. "배포 환경 확정 시 조정" 표시는 임시값이다.
# - 목록 값(ports 등)은 덮어쓰기 파일에서 다시 적으면 교체가 아니라 추가되므로, 공개 범위는 .env 의
#   FRONTEND_BIND·FRONTEND_PORT 로 바꾼다.
# - 개발용 설정(compose.dev.yaml)과 함께 쓰지 않는다.

x-logging: &logging
  # 컨테이너 로그가 디스크를 채우지 않게 크기를 제한한다(파일당 10MB × 5개)
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mariadb:
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }   # 배포 환경 확정 시 조정

  model-server:
    logging: *logging
    deploy:
      resources:
        # torch + M1·M2(fp32). 실측 대기 약 0.4GB, 분석 중 더 쓴다 — 배포 환경 확정 시 조정
        limits: { cpus: "2.0", memory: 2g }

  ollama:
    logging: *logging
    deploy:
      resources:
        # bge-m3 적재 실측 약 1.2GB — 배포 환경 확정 시 조정
        limits: { cpus: "1.0", memory: 2g }

  backend-init:
    logging: *logging

  backend-embed:
    logging: *logging

  backend:
    logging: *logging
    environment:
      NODE_ENV: production
      AUTH_DEV_PROVIDER: "false"
      LOG_LEVEL: info
      # 운영은 HTTPS 앞단(리버스 프록시·로드밸런서)을 전제로 secure 쿠키를 쓴다(production 이면 auto = on).
      # HTTPS 없이 HTTP 로 시험할 때만 .env 에 COOKIE_SECURE=off
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }   # 배포 환경 확정 시 조정

  frontend:
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
